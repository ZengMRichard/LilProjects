[project]
name = "almanac"
version = "0.1.0"
description = "Open-source, keyboard-first financial terminal: local server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "websockets>=13",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.scripts]
almanac = "almanac.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pandas>=2.2",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/almanac"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
markers = ["live: hits real provider APIs with the maintainer's keys (nightly only)"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["server"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
